
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder, and register custom panel JS
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/esp32_commander/esp32-commander-panel.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

panel_custom:
  - name: esp32-commander-panel
    sidebar_title: ESP32 Commander
    sidebar_icon: mdi:chip
    url_path: esp32-commander
    module_url: /local/esp32_commander/esp32-commander-panel.js

# Load the ESP32 Commander custom component
esp32_commander: