# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/custom-sidebar/custom-sidebar-plugin.js
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421
    - /local/alleycat-scanlines.js?v=0.10
    - /local/directory/directory-client.js?v=1
    - /local/directory/directory-panel.js?v=3
    - /local/digital_node_nexus/digital-node-nexus-panel.js
    - /local/alleycattv/alleycattv-panel.js?v=dir-1
    - /local/alleycattv/alleycattv-content-panel.js?v=dir-1
    - /local/registration/registration-panel.js
    - /local/bounty/bounty-panel.js
    - /local/bugbuster/bugbuster-panel.js?v=4

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

rest: !include rest.yaml
rest_command: !include rest_commands.yaml

panel_custom:
  - name: alleycat-directory-panel
    sidebar_title: Core Configurator
    sidebar_icon: mdi:lan
    url_path: directory
    module_url: /local/directory/directory-panel.js?v=3

  - name: registration-panel
    sidebar_title: Registration
    sidebar_icon: mdi:radar
    url_path: registration
    module_url: /local/registration/registration-panel.js

  - name: digital-node-nexus-panel
    sidebar_title: Digital Node Nexus
    sidebar_icon: mdi:chip
    url_path: digital-node-nexus
    module_url: /local/digital_node_nexus/digital-node-nexus-panel.js

  - name: alleycattv-panel
    sidebar_title: AlleycatTV
    sidebar_icon: mdi:television-play
    url_path: alleycattv
    module_url: /local/alleycattv/alleycattv-panel.js?v=dir-1
    config:
      server_url: "http://headless-alleycat-streaming-server.local"

  - name: alleycattv-content-panel
    sidebar_title: Content Manager
    sidebar_icon: mdi:folder-play
    url_path: alleycattv-content
    module_url: /local/alleycattv/alleycattv-content-panel.js?v=dir-1
    config:
      server_url: "http://headless-alleycat-streaming-server.local"

  - name: bounty-panel
    sidebar_title: Galactic Bounty Network
    sidebar_icon: mdi:skull-crossbones
    url_path: bounty
    module_url: /local/bounty/bounty-panel.js
    config:
      server_url: !secret bounty_base

  - name: bugbuster-panel
    sidebar_title: Bug Buster
    sidebar_icon: mdi:ladybug
    url_path: bugbuster
    module_url: /local/bugbuster/bugbuster-panel.js?v=4

digital_node_nexus:
alleycattv:
  server_url: !secret alleycattv_base
registration:
  base_url: !secret player_api_base
bounty:
  server_url: !secret bounty_base
alleycat_directory:
  registration_primary: !secret player_api_base
  registration_secondary: !secret player_api_local
  alleycattv: !secret alleycattv_base
  bounty: !secret bounty_base
  proxmox: !secret proxmox_url
  proxmox_node: !secret proxmox_node
  proxmox_token_id: !secret bugbuster_token_id
  proxmox_token_secret: !secret bugbuster_token_secret
bugbuster:
  token_id: !secret bugbuster_token_id
  token_secret: !secret bugbuster_token_secret
  verify_ssl: false
