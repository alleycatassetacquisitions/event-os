#
# Add the following to your configuration.yaml:

# -- MQTT (skip if already configured) --
mqtt:
  broker: localhost        # or your Mosquitto broker IP
  port: 1883
  # username: your_user   # uncomment if broker requires auth
  # password: your_pass

# -- Register the custom frontend JS file --
frontend:
  extra_module_url:
    - /local/digital_node_nexus/digital-node-nexus-panel.js

# -- Register the sidebar panel --
panel_custom:
  - name: digital-node-nexus-panel
    sidebar_title: Digital Node Nexus
    sidebar_icon: mdi:chip
    url_path: digital-node-nexus
    module_url: /local/digital_node_nexus/digital-node-nexus-panel.js


