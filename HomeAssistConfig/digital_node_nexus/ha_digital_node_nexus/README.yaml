#
# Open digital_node_nexus_firmware.ino in Arduino IDE.
# Edit the top section:
#
#   const char* DEVICE_ID     = "esp32-device-01";  â† unique per device!
#   const char* WIFI_SSID     = "YOUR_SSID";
