#   const char* MQTT_HOST     = "192.168.1.x";      â† your HA/broker IP
#
# Flash to device. Repeat for each device with a unique DEVICE_ID.
# Devices auto-register when they first publish their status.


# â”€â”€ STEP 5: Verify â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
#
# In HA, go to Developer Tools â†’ MQTT and subscribe to:
#   esp32/+/status
#
# Power on an ESP32 â€” you should see its JSON status appear within seconds.
# Then open the Digital Node Nexus sidebar panel and the device will appear!


# â”€â”€ MQTT TOPIC REFERENCE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
#
#  Direction  | Topic                          | Payload
#  -----------|--------------------------------|----------------------------
#  HA â†’ ESP32 | esp32/{id}/cmd/message         | {"text":"Hi","duration":5}
#  HA â†’ ESP32 | esp32/{id}/cmd/led             | {"state":true,"brightness":255,...}
#  HA â†’ ESP32 | esp32/{id}/cmd/haptic          | {"pattern":"short","intensity":200}
#  ESP32 â†’ HA | esp32/{id}/status              | {"rssi":-65,"uptime":120,...}


# â”€â”€ CALLING SERVICES FROM AUTOMATIONS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
#
# You can also call Digital Node Nexus services from automations/scripts:

# Send a message:
service: digital_node_nexus.send_message
data:
  device_id: "esp32-device-01"
  message: "Motion detected!"
  duration: 10
  scroll: false

# Set LED:
service: digital_node_nexus.set_led
data:
  device_id: "esp32-device-01"
  state: true
  brightness: 200
  red: 255
  green: 0
  blue: 0
  effect: blink

# Trigger haptic:
service: digital_node_nexus.trigger_haptic
data:
  device_id: "esp32-device-01"
  pattern: double
  intensity: 200
  duration_ms: 150
  repeat: 2

# Send raw command (for future custom actions):
service: digital_node_nexus.send_raw
data:
  device_id: "esp32-device-01"
  action: buzzer
  payload:
    frequency: 1000
    duration_ms: 500
