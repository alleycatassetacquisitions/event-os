syntax = "proto3";

// ── Commands (HA → ESP32) ─────────────────────────────────────────────────

// esp32/{device_id}/cmd/message
message MessageCmd {
  string text     = 1;  // Text to display
  int32  duration = 2;  // Display duration in seconds
  bool   scroll   = 3;  // Whether to scroll long text
}

// esp32/{device_id}/cmd/led
message LedCmd {
  bool   state      = 1;  // true = on, false = off
  int32  brightness = 2;  // 0–255
  int32  r          = 3;  // Red channel 0–255
  int32  g          = 4;  // Green channel 0–255
  int32  b          = 5;  // Blue channel 0–255
  string effect     = 6;  // solid | blink | pulse | rainbow
}

// esp32/{device_id}/cmd/haptic
message HapticCmd {
  string pattern     = 1;  // short | long | double | sos | custom
  int32  intensity   = 2;  // 0–255 motor drive strength
  int32  duration_ms = 3;  // Single pulse length in ms (used by custom)
  int32  repeat      = 4;  // Number of times to repeat the pattern
}

// esp32/{device_id}/cmd/{any other action}
// payload_json carries an arbitrary JSON string for extensibility
message RawCmd {
  string payload_json = 1;
}

// ── Status (ESP32 → HA) ───────────────────────────────────────────────────

// esp32/{device_id}/status  (retained=true)
// An empty/zero message (online=false, device_id="") is used as the LWT
// to signal that the device has disconnected.
message StatusMsg {
  string device_id = 1;
  string firmware  = 2;
  string ip        = 3;
  sint32 rssi      = 4;  // Typically negative; sint32 uses zigzag encoding for efficiency
  int32  uptime    = 5;  // Seconds since boot
  int32  free_heap = 6;  // Free heap bytes
  bool   led_state = 7;
  int64  timestamp = 8;  // millis() at publish time
  bool   online    = 9;  // true = device is up; false (default) = LWT / offline
}
