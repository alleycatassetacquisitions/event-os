; PlatformIO Project Configuration File
;
; PDN (Personal Device Node) — ESP32-S3 firmware
; Framework: ESP-IDF (no Arduino dependency)
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform        = espressif32
board           = esp32-s3-devkitm-1
framework       = espidf
monitor_speed   = 115200
upload_protocol = esp-builtin
board_upload.flash_size = 2MB
board_build.flash_size  = 2MB

lib_deps =
    nanopb/Nanopb @ ^0.4.8

; Workaround for a known Xtensa GCC ICE (internal compiler error / segfault)
; in esp_lcd_panel_rgb.c during the IRA optimisation pass at -O2.
; -fno-ipa-cp disables interprocedural constant propagation, which avoids the
; crash without affecting our code's behaviour or performance.
build_flags =
    -fno-ipa-cp

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
